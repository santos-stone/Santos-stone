<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Santos Stone</title>
<style>
:root{
  --bg:#f4f6fb; --text:#1b1f2a; --card:#ffffff; --shadow:0 6px 18px rgba(0,0,0,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#12141b;--text:#f2f4f8;--card:#1d2029;--shadow:0 6px 18px rgba(0,0,0,.4)}
}
:root[data-theme="dark"]{--bg:#12141b;--text:#f2f4f8;--card:#1d2029;--shadow:0 6px 18px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:28px 16px}
.logo{background:#fff;border-radius:24px;padding:12px 20px;box-shadow:var(--shadow);margin-bottom:12px}
#title{display:none}
.logo img{display:block;width:100%;max-width:200px;height:auto}
h1{font-size:1.5rem;margin:8px 0 4px}
p.sub{margin:0 0 28px;opacity:.65;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;width:100%;max-width:420px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);max-width:600px}}
a.tile{background:var(--card);border-radius:22px;box-shadow:var(--shadow);
  padding:22px 10px;text-decoration:none;color:var(--text);
  display:flex;flex-direction:column;align-items:center;gap:12px;
  transition:transform .15s ease}
a.tile:active{transform:scale(.95)}
@media(hover:hover){a.tile:hover{transform:translateY(-4px)}}
.icon{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:2.2rem;line-height:1}
.icon img{width:100%;height:100%;display:block;border-radius:20px}
.icon svg{width:40px;height:40px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.name{font-weight:600;font-size:1rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:22px;padding:24px;width:100%;max-width:360px;text-align:center;box-shadow:var(--shadow)}
.modal h2{margin:0 0 6px;font-size:1.2rem}
.hint{margin:0 0 14px;opacity:.65;font-size:.9rem}
.num{direction:ltr;font-size:1.5rem;font-weight:700;letter-spacing:.5px;background:var(--bg);border-radius:14px;padding:14px 8px;margin-bottom:14px;word-break:break-all;user-select:all}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:1rem;font-weight:700;background:#1877F2;color:#fff;cursor:pointer;margin-bottom:10px;text-decoration:none;font-family:inherit}
.btn.alt{background:#6d2fa0}
.btn.gray{background:#6b7280}
.close{background:none;border:0;color:var(--text);opacity:.6;font-size:.95rem;cursor:pointer;font-family:inherit}
</style>
</head>

const items = [
  { name:"Facebook",   bg:"#1877F2", icon:"f", url: me.facebook },
  { name:"WhatsApp",   bg:"#25D366", icon:"whatsapp", url: me.whatsapp && ("https://wa.me/" + me.whatsapp) },
  { name:"Instagram", bg:"linear-gradient(45deg,#f9a825,#e1306c,#7b3fbf)", icon:"insta", url: me.instagram },
  { name:"TikTok",  bg:"#111111", icon:"♪", url: me.tiktok },
  { name:"InstaPay", bg:"#6d2fa0", icon:"pay", url: me.instapay.link, modal:{ title:"Pay via InstaPay", hint:"Payment address copied. Open InstaPay and transfer to it.", value: me.instapay.address, link: me.instapay.link, linkText:"Open payment link" } },
  { name:"Wallet",  bg:"#e53935", icon:"wallet", modal:{ title:"Pay via Wallet", hint: me.wallet.label, value: me.wallet.number, link: me.wallet.link, linkText:"Open Vodafone Cash link" } }
];

document.getElementById("title").textContent = me.title;
document.getElementById("sub").textContent = me.subtitle;
document.title = me.title;

const grid = document.getElementById("grid");
items.forEach(it=>{
  const hasData = it.modal ? it.modal.value : it.url;
  if(!hasData) return;
  const a = document.createElement("a");
  a.className = "tile";
  if(it.modal && !it.url){
    a.href = "#";
    a.onclick = e=>{ e.preventDefault(); openModal(it.modal); };
  } else {
    a.href = it.url; a.target = "_blank"; a.rel = "noopener";
  }
  const pic = imgs[it.icon];
  a.innerHTML = pic
    ? `<div class="icon" style="background:none"><img src="${pic}" alt="${it.name}"></div><div class="name">${it.name}</div>`
    : `<div class="icon" style="background:${it.bg}">${svgs[it.icon] || it.icon}</div><div class="name">${it.name}</div>`;
  grid.appendChild(a);
});

const ov = document.getElementById("ov");
function openModal(m){
  document.getElementById("mt").textContent = m.title;
  document.getElementById("md").textContent = m.hint || "";
  document.getElementById("mn").textContent = m.value;
  const cp = document.getElementById("copy");
  cp.textContent = "Copy";
  cp.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(m.value); cp.textContent = "Copied ✓"; }
    catch(e){
      const r = document.createRange(); r.selectNodeContents(document.getElementById("mn"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); cp.textContent = "Select the text and copy it";
    }
  };
  const op = document.getElementById("open");
  const cl = document.getElementById("copylink");
  if(m.link){
    op.href = m.link; op.textContent = m.linkText; op.style.display = "block";
    op.onclick = e=>{
      e.preventDefault();
      let w = null;
      try{ w = window.open(m.link, "_blank"); }catch(_){}
      if(!w){ try{ window.top.location.href = m.link; }catch(_){ location.href = m.link; } }
    };
    cl.style.display = "block"; cl.textContent = "Copy link";
    cl.onclick = async ()=>{ try{ await navigator.clipboard.writeText(m.link); cl.textContent = "Link copied ✓"; }catch(_){ cl.textContent = m.link; } };
  } else { op.style.display = "none"; cl.style.display = "none"; }
  ov.classList.add("show");
  if(navigator.clipboard){ navigator.clipboard.writeText(m.value).then(()=>{cp.textContent="Copied ✓";}).catch(()=>{}); }
}
document.getElementById("close").onclick = ()=>ov.classList.remove("show");
ov.onclick = e=>{ if(e.target===ov) ov.classList.remove("show"); };
</script>
</body>
</html>
